    <rect x="62" y="420" width="54" height="160"/>
    <rect x="110" y="380" width="64" height="200"/>
    <rect x="168" y="445" width="48" height="135"/>
    <rect x="210" y="350" width="58" height="230"/>
    <rect x="262" y="410" width="70" height="170"/>
    <rect x="326" y="465" width="52" height="115"/>
    <rect x="372" y="430" width="60" height="150"/>
    <rect x="428" y="485" width="66" height="95"/>
    <rect x="490" y="455" width="44" height="125"/>
