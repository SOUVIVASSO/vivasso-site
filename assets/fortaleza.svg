    <rect x="224" y="372" width="8" height="10"/><rect x="242" y="400" width="8" height="10"/><rect x="224" y="440" width="8" height="10"/>
    <rect x="276" y="430" width="8" height="10"/><rect x="298" y="460" width="8" height="10"/>
    <rect x="76" y="450" width="8" height="10"/><rect x="380" y="455" width="8" height="10"/>
