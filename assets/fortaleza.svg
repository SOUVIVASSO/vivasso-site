<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a78"/>
      <stop offset=".35" stop-color="#b0558f"/>
      <stop offset=".62" stop-color="#ff8a5c"/>
      <stop offset=".82" stop-color="#ffc24a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb04a"/>
      <stop offset=".25" stop-color="#e0668a"/>
      <stop offset="1" stop-color="#2b3f8c"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset=".5" stop-color="#ffd25a"/>
      <stop offset="1" stop-color="#ffd25a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1030" cy="520" r="330" fill="url(#sun)" opacity=".85"/>
  <circle cx="1030" cy="520" r="92" fill="#fff1b8"/>

  <!-- nuvens -->
