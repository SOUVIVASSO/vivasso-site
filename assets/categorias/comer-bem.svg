<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice"><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.o{transform-box:fill-box;transform-origin:center}@keyframes b1{0%{transform:translate(0,0)}100%{transform:translate(18px,-14px)}}@keyframes b2{0%{transform:translate(0,0)}100%{transform:translate(-16px,16px)}}@keyframes b3{0%{transform:translate(0,0)}100%{transform:translate(14px,12px)}}@keyframes b4{0%{transform:translate(0,0)}100%{transform:translate(-10px,-18px)}}.f1{animation:b1 7s ease-in-out infinite alternate}.f2{animation:b2 9s ease-in-out infinite alternate}.f3{animation:b3 8s ease-in-out infinite alternate}.f4{animation:b4 6s ease-in-out infinite alternate}</style><rect width="800" height="500" fill="#e8a21c"/><circle class="o f1" cx="250" cy="280" r="150" fill="#fff" opacity="0.18"/><circle class="o f2" cx="430" cy="200" r="110" fill="#d281aa" opacity="0.55"/><circle class="o f3" cx="600" cy="320" r="130" fill="#3f9a8f" opacity="0.45"/><circle class="o f4" cx="700" cy="120" r="50" fill="#fff" opacity="0.5"/></svg>