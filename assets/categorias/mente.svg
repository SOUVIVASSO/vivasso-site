<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice"><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.o{transform-box:fill-box;transform-origin:center}@keyframes respira{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}.anel{animation:respira 6s ease-in-out infinite}.miolo{animation:respira 6s ease-in-out infinite;animation-delay:2s}</style><rect width="800" height="500" fill="#8e74c8"/><circle class="o anel" style="animation-delay:0s" cx="560" cy="250" r="260" fill="#fff" opacity="0.06"/><circle class="o anel" style="animation-delay:0.5s" cx="560" cy="250" r="200" fill="#fff" opacity="0.08"/><circle class="o anel" style="animation-delay:1s" cx="560" cy="250" r="140" fill="#fff" opacity="0.1"/><circle class="o anel" style="animation-delay:1.5s" cx="560" cy="250" r="80" fill="#fff" opacity="0.14"/><circle class="o miolo" cx="560" cy="250" r="34" fill="#fdb72a" opacity="0.9"/></svg>