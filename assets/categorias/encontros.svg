<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice"><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.o{transform-box:fill-box;transform-origin:center}@keyframes vai{0%{transform:translateX(0)}100%{transform:translateX(30px)}}@keyframes vem{0%{transform:translateX(0)}100%{transform:translateX(-30px)}}@keyframes pulsa{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}.ea{animation:vai 6s ease-in-out infinite alternate}.eb{animation:vem 6s ease-in-out infinite alternate}.ec{animation:pulsa 3s ease-in-out infinite}</style><rect width="800" height="500" fill="#d281aa"/><circle class="o ea" cx="330" cy="250" r="150" fill="#fff" opacity="0.22"/><circle class="o eb" cx="470" cy="250" r="150" fill="#8e74c8" opacity="0.55"/><circle class="o ec" cx="400" cy="250" r="40" fill="#fdb72a" opacity="0.95"/></svg>